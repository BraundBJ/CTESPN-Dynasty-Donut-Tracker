name: Refresh leaderboard

on:
  schedule:
    - cron: '17 17 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'tracker.py'
      - 'early_injuries.json'
      - 'leaderboard.html.template'
      - 'web/index.html'
      - '.github/workflows/refresh.yml'

concurrency:
  group: leaderboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    outputs:
      publish: ${{ steps.pages.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - name: Install game-book reader
        run: python3 -m pip install --target "$RUNNER_TEMP/python" pypdf==6.21.4
      - name: Check completed weeks
        env:
          PYTHONPATH: ${{ runner.temp }}/python
        run: python3 tracker.py --site web
      - name: Save changes
        run: |
          if git diff --quiet -- README.md web/index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md web/index.html
          git commit -m "Refresh zero-point starter leaderboard"
          git push
      - name: Check GitHub Pages source
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response="$RUNNER_TEMP/pages-settings.json"
          status=$(curl --silent --show-error --retry 2 --max-time 15 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --output "$response" --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          case "$status" in
            200)
              if [ "$(jq -r .build_type "$response")" = workflow ]; then
                echo 'publish=true' >> "$GITHUB_OUTPUT"
              else
                echo "::notice::Set the Pages source to GitHub Actions to enable publishing."
              fi
              ;;
            404) echo "::notice::Enable GitHub Actions as the Pages source to publish the site." ;;
            *) echo "::error::GitHub Pages settings check returned HTTP $status."; exit 1 ;;
          esac
      - uses: actions/upload-pages-artifact@v4
        if: steps.pages.outputs.publish == 'true'
        with:
          path: web

  publish:
    needs: refresh
    if: needs.refresh.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish website
        id: deploy
        uses: actions/deploy-pages@v4
